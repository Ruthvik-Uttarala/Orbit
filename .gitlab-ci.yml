# Orbit DevOps - Main CI/CD Pipeline
# This pipeline handles building, testing, and deployment

stages:
  - validate
  - build
  - test
  - deploy

variables:
  DOCKER_IMAGE: "$CI_REGISTRY_IMAGE"
  NODE_VERSION: "18"
  NPM_FLAGS: "--prefer-offline --no-audit"

# Default configuration for all jobs
default:
  image: node:18
  interruptible: true

.backend-node:
  cache:
    key:
      files:
        - backend/package-lock.json
    paths:
      - backend/.npm/

.frontend-node:
  cache:
    key:
      files:
        - frontend/package-lock.json
    paths:
      - frontend/.npm/

# Stage 1: Validation
validate:project:
  stage: validate
  script:
    - echo "=== Validating Project Configuration ==="
    - echo "GitLab CI pipeline configuration is valid"
    - echo "=== Validating Agent Configurations ==="
    - ls -la .gitlab/agents/
    - echo "=== Validating Flow Configurations ==="
    - ls -la flows/
    - echo "Project configuration validated"

# Stage 2: Build
build:backend:
  stage: build
  extends: .backend-node
  script:
    - echo "=== Building Backend ==="
    - cd backend
    - npm ci --cache .npm $NPM_FLAGS
    - npm run build
    - echo "Backend build complete"
  artifacts:
    paths:
      - backend/dist/
    expire_in: 1 hour

build:frontend:
  stage: build
  extends: .frontend-node
  script:
    - echo "=== Building Frontend ==="
    - cd frontend
    - npm ci --cache .npm $NPM_FLAGS
    - npm run build
    - echo "Frontend build complete"
  artifacts:
    paths:
      - frontend/build/
    expire_in: 1 hour

# Stage 3: Test
test:backend:
  stage: test
  extends: .backend-node
  script:
    - echo "=== Running Backend Tests ==="
    - cd backend
    - npm ci --cache .npm $NPM_FLAGS
    - npm test
  coverage: '/All files\s*\|\s*([\d\.]+)/'

test:frontend:
  stage: test
  extends: .frontend-node
  script:
    - echo "=== Running Frontend Tests ==="
    - cd frontend
    - npm ci --cache .npm $NPM_FLAGS
    - npm test -- --watchAll=false --passWithNoTests

test:integration:
  stage: test
  extends: .backend-node
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "develop"'
      when: manual
    - when: never
  script:
    - echo "=== Running Integration Tests ==="
    - cd backend
    - npm ci --cache .npm $NPM_FLAGS
    - npm run test:integration
  allow_failure: true

# Stage 4: Deployment
deploy:staging:
  stage: deploy
  script:
    - echo "=== Deploying to Staging ==="
    - echo "Staging deployment initiated"
    - npm run deploy:staging
  environment:
    name: staging
    url: https://staging.orbit-devops.example.com
  only:
    - develop
  when: manual

deploy:production:
  stage: deploy
  script:
    - echo "=== Deploying to Production ==="
    - echo "Production deployment initiated"
    - npm run deploy:production
  environment:
    name: production
    url: https://orbit-devops.example.com
  only:
    - main
  when: manual

# Pipeline triggered by GitLab Agent
agent:trigger:
  stage: deploy
  script:
    - echo "=== GitLab Agent Triggered Pipeline ==="
    - echo "Pipeline triggered by GitLab Agent"
  only:
    - triggers
