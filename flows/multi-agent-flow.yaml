# Multi-Agent Orchestration Flow
# Coordinates Code Agent, Git Agent, CI/CD Agent, and Debug Agent

name: multi-agent-flow
version: v1
description: Multi-agent orchestration for complete SDLC automation

# Flow triggers
triggers:
  - type: manual
    action: full-deployment
  - type: webhook
    endpoint: /api/flows/multi-agent

# Agent roles configuration
agents:
  code-agent:
    name: Code Agent
    role: code_generation
    description: Generates and modifies code based on requirements
    capabilities:
      - generate-code
      - modify-code
      - write-tests
      - create-documentation
    timeout: 300s

  git-agent:
    name: Git Agent
    role: version_control
    description: Handles all Git operations including commits, branches, merges
    capabilities:
      - create-branch
      - commit-changes
      - merge-branch
      - create-pull-request
      - resolve-conflicts
    timeout: 120s

  cicd-agent:
    name: CI/CD Agent
    role: pipeline_execution
    description: Manages CI/CD pipeline execution and monitoring
    capabilities:
      - trigger-pipeline
      - monitor-pipeline
      - fetch-logs
      - artifacts-management
    timeout: 600s

  debug-agent:
    name: Debug Agent
    role: debugging
    description: Analyzes failures and suggests fixes
    capabilities:
      - analyze-logs
      - identify-issues
      - suggest-fixes
      - auto-remediation
    timeout: 180s

# Orchestration stages
stages:
  - name: workspace-preparation
    description: Create a version-controlled workspace before editing files
    agent: git-agent
    steps:
      - name: create-feature-branch
        action: create-branch
        from: main

  - name: code-generation
    description: Generate code using Code Agent
    agent: code-agent
    depends_on: workspace-preparation
    steps:
      - name: analyze-requirements
        action: analyze
        input: requirements
      - name: generate-code
        action: generate
        output: source-files
      - name: generate-tests
        action: generate-tests
      - name: validate-code
        action: validate

  - name: version-control
    description: Version control operations using Git Agent
    agent: git-agent
    depends_on: code-generation
    steps:
      - name: commit-changes
        action: commit
        files: source-files
      - name: push-branch
        action: push

  - name: pipeline-execution
    description: CI/CD pipeline execution
    agent: cicd-agent
    depends_on: version-control
    steps:
      - name: trigger-pipeline
        action: trigger
        pipeline: build-test-deploy
      - name: monitor-execution
        action: monitor
        poll_interval: 30s
      - name: fetch-results
        action: results

  - name: failure-analysis
    description: Analyze failures and fix if possible
    agent: debug-agent
    condition: pipeline_failed
    depends_on: pipeline-execution
    steps:
      - name: analyze-failure
        action: analyze
      - name: identify-root-cause
        action: identify
      - name: generate-fix
        action: fix
      - name: retry-pipeline
        action: retry

  - name: merge-complete
    description: Merge changes after successful pipeline
    agent: git-agent
    depends_on: 
      - pipeline-execution
      - failure-analysis
    condition: all_passed
    steps:
      - name: create-merge-request
        action: merge-request
      - name: merge-branch
        action: merge

# Error handling with Debug Agent integration
error_handling:
  on_failure:
    - agent: debug-agent
      action: analyze
    - agent: debug-agent
      action: suggest-fix
    - retry: true
      max_attempts: 2

# Progress tracking
progress:
  steps:
    - code-generation
    - version-control
    - pipeline-execution
    - failure-analysis (conditional)
    - merge-complete

# Output
output:
  logs: true
  metrics: true
  artifacts: true
  timeline: true
